name: NKP Public Dev Runner

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/nkp-public-dev.yml"

permissions:
  actions: write
  contents: read

jobs:
  cancel-current:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel previous NKP run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/shg2342/actope321dge31f/actions/runs/36407922890/cancel
          echo "cancel requested for run 36407922890"
