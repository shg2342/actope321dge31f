name: NKP Public Dev Runner

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nkp-public-dev
  cancel-in-progress: true

jobs:
  run-nkp:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: "1234"
          MARIADB_DATABASE: nkp_dumy
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout private NKP source
        uses: actions/checkout@v4
        with:
          repository: shg2342/nkp-v2-codex
          ref: main
          token: ${{ secrets.TOKEN }}
          path: nkp-src
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: nkp-src
        run: npm ci

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client

      - name: Restore NKP database
        env:
          MYSQL_PWD: "1234"
        run: |
          for i in {1..40}; do
            if mysql -h 127.0.0.1 -P 3306 -u root -e "SELECT 1" >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          mysql -h 127.0.0.1 -P 3306 -u root nkp_dumy < nkp-src/database/nkp_dumy_seed.sql

      - name: Start NKP backend
        working-directory: nkp-src
        env:
          NODE_ENV: development
          PORT: "3100"
          SESSION_SECRET: nkp-public-vite-session
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USER: root
          DB_PASSWORD: "1234"
          DB_NAME: nkp_dumy
        run: |
          nohup node --watch src/server.js > ../nkp-backend.log 2>&1 &
          echo $! > ../nkp-backend.pid
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:3100/login >/dev/null; then
              echo "NKP backend ready on 3100"
              exit 0
            fi
            sleep 2
          done
          cat ../nkp-backend.log || true
          exit 1

      - name: Start Vite frontend
        working-directory: nkp-src
        run: |
          cat > vite.runner.config.mjs <<'EOF'
          export default {
            appType: 'custom',
            server: {
              host: '0.0.0.0',
              port: 5173,
              strictPort: true,
              proxy: {
                '/': {
                  target: 'http://127.0.0.1:3100',
                  changeOrigin: true,
                  ws: true
                }
              }
            }
          };
          EOF
          nohup npx --yes vite@latest --config vite.runner.config.mjs --host 0.0.0.0 --port 5173 > ../vite-dev.log 2>&1 &
          echo $! > ../vite-dev.pid
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:5173/login >/dev/null; then
              echo "Vite frontend ready on 5173"
              exit 0
            fi
            sleep 2
          done
          cat ../vite-dev.log || true
          exit 1
